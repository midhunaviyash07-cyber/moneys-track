function openM(k,c){
M={k:k,c:c};var add=k=="in"||k=="out";

$("fd").style.display=add?"block":"none";

if(k=="pin"){if(!/^\d{4}$/.test(v)){$("err").textContent=t("pinq");return}S.pin=v;save();closeM();render();return}
var a=parseFloat(v);if(!(a>0)){$("err").textContent=t("amtq");return}
if(k=="goal"){S.goal=a}else if(k=="bud"){S.bud=a}else if(k=="med"){S.med=a}
else{var d=$("dt").value;if(!/^\d{4}-\d{2}-\d{2}$/.test(d)){$("err").textContent=t("dtq");return}

document.addEventListener("click",function(e){

else if(x=="print"){try{window.print()}catch(er){}}
else if(x=="backup")dl("money-backup-"+iso(new Date())+".json",JSON.stringify(S),"application/json");
else if(x=="restore")$("fi").click();
else if(x=="csv"){var r=["Date,Type,Purpose,Amount,Note"];sorted(S.items).forEach(function(i){r.push([i.date,i.type=="in"?"Received":"Spent",nm(i),i.amt,'"'+String(i.note||"").replace(/"/g,'""')+'"'].join(","))});dl("statement.csv","\ufeff"+r.join("\n"),"text/csv;charset=utf-8")}
else if(x=="reset"){if(ask(t("resetq"))){S.items=[];S.goal=0;S.bud=0;S.med=0;save();render()}}
});

function sh(s){var x=5381,i;for(i=0;i<s.length;i++)x=((x<<5)+x+s.charCodeAt(i))|0;return "f"+x}
function hs(p,s,fb,cb){var str=s+":"+p;try{if(!fb&&window.crypto&&crypto.subtle&&window.TextEncoder){crypto.subtle.digest("SHA-256",new TextEncoder().encode(str)).then(function(b){cb(Array.prototype.map.call(new Uint8Array(b),function(x){return ("0"+x.toString(16)).slice(-2)}).join(""))}).catch(function(){cb(sh(str))});return}}catch(e){}cb(sh(str))}
function chk(p,s,st,cb){hs(p,s,st.charAt(0)=="f",function(h){cb(h===st)})}
